# Environnement de développement : hot reload partout, un seul port à partager (5173, D-17).
name: stockpredict

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockpredict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpredict}
      POSTGRES_DB: ${POSTGRES_DB:-stockpredict}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stockpredict}:${POSTGRES_PASSWORD:-stockpredict}@db:5432/${POSTGRES_DB:-stockpredict}
      SOURCES_BASE_URL: http://sources-mock:8100
      SOURCES_API_KEY: ${SOURCES_API_KEY:-dev-mock-key}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  sources-mock:
    build: ./sources-mock
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    environment:
      MOCK_API_KEY: ${SOURCES_API_KEY:-dev-mock-key}
      # Pannes permanentes simulées, ex. "purchase-orders=timeout" (parcours 2 du dossier)
      MOCK_PANNES: ${MOCK_PANNES:-}
      # Date « aujourd'hui » du monde simulé (vide = date du jour)
      MOCK_DATE_REFERENCE: ${MOCK_DATE_REFERENCE:-}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8100:8100"
    volumes:
      - ./sources-mock:/app
      - ./data:/data

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:

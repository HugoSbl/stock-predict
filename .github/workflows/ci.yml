name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockpredict
          POSTGRES_PASSWORD: stockpredict
          POSTGRES_DB: stockpredict
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockpredict" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://stockpredict:stockpredict@localhost:5432/stockpredict
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - name: Audit des dépendances (non bloquant jusqu'au lot 8)
        run: uv export --format requirements-txt --no-emit-project | uv run pip-audit -r /dev/stdin --disable-pip
        continue-on-error: true

  sources-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sources-mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit des dépendances (non bloquant jusqu'au lot 8)
        run: npm audit --audit-level=high
        continue-on-error: true
